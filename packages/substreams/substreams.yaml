specVersion: v0.1.0
package:
  name: plimsoll_erc4626
  version: v0.2.0
  description: >-
    Chain-wide ERC-4626 vault registry, normalised share-price series with
    entry and exit rates kept separate, nominated holder positions for coverage
    attestation, and Messari Yield Aggregator v1.3.1 entities, derived from
    Pinax's erc4626 extractor. Ethereum mainnet and Base.
  url: https://github.com/RaYYeR220/plimsoll
  # The Plimsoll line: a circle crossed by a horizontal line, the mark that
  # says how deeply a hull may be loaded.
  image: ./plimsoll-mark.png
  # No doc field: the CLI ignores package.doc and embeds the README.md sitting
  # beside this manifest, which for this package is the repository README.

network: mainnet

imports:
  # Pinned to the commit that added the file (pinax-network/substreams-evm#259)
  # so a later push to main cannot silently change what this package runs.
  erc4626: https://raw.githubusercontent.com/pinax-network/substreams-evm/1535a557975fb79d1e78517bf3e5bd6d18a1635a/spkg/erc4626-v0.1.0.spkg

protobuf:
  files:
    - plimsoll/erc4626/v1/vaults.proto
    - messari/yield_aggregator/v1/entities.proto
  importPaths:
    - ./proto
  excludePaths:
    - sf/substreams
    - google

binaries:
  default:
    type: wasm/rust-v1
    file: ./target/wasm32-unknown-unknown/release/plimsoll_erc4626.wasm

modules:
  - name: map_flows
    kind: map
    initialBlock: 25940000
    inputs:
      - params: string
      - source: sf.substreams.v1.Clock
      - map: erc4626:map_events
    output:
      type: proto:plimsoll.erc4626.v1.Flows
    doc: Deposit / Withdraw logs flattened and stamped with block number, hash and timestamp. Params is an optional comma-separated vault allowlist.

  - name: store_vault_seen
    kind: store
    initialBlock: 25940000
    updatePolicy: set_if_not_exists
    valueType: string
    inputs:
      - map: map_flows
    doc: First sighting of each emitting address and of each event side (d:/w:), used for the co-occurrence check.

  - name: map_vault_probes
    kind: map
    initialBlock: 25940000
    inputs:
      - store: store_vault_seen
        mode: deltas
    output:
      type: proto:plimsoll.erc4626.v1.VaultInfos
    doc: One-shot eth_call probe of asset(), decimals(), name(), symbol() on each newly seen address and on its underlying.

  - name: store_vault_registry
    kind: store
    initialBlock: 25940000
    updatePolicy: set
    valueType: proto:plimsoll.erc4626.v1.VaultInfo
    inputs:
      - map: map_vault_probes
    doc: Vault registry keyed vault:<address>, including rejected addresses.

  - name: map_vault_blocks
    kind: map
    initialBlock: 25940000
    inputs:
      - params: string
      - source: sf.substreams.v1.Clock
      - map: map_flows
      - store: store_vault_registry
      - store: store_vault_seen
    output:
      type: proto:plimsoll.erc4626.v1.VaultBlocks
    doc: Per vault per block - normalised flows, entry and exit rates, end-of-block totalAssets / totalSupply, share price and TVL. Params is the network's pricing table.

  - name: store_vault_state
    kind: store
    initialBlock: 25940000
    updatePolicy: set
    valueType: proto:plimsoll.erc4626.v1.VaultBlock
    inputs:
      - map: map_vault_blocks
    doc: Latest VaultBlock per vault.

  - name: store_accounts
    kind: store
    initialBlock: 25940000
    updatePolicy: set_if_not_exists
    valueType: int64
    inputs:
      - map: map_flows
      - store: store_vault_registry
    doc: First block each share owner was seen, for cumulativeUniqueUsers.

  - name: store_totals
    kind: store
    initialBlock: 25940000
    updatePolicy: add
    valueType: bigint
    inputs:
      - map: map_vault_blocks
      - map: map_vault_probes
      - store: store_accounts
        mode: deltas
      - store: store_vault_state
        mode: deltas
    doc: Cumulative flows, revenue (asset wei and USD at 1e18), protocol TVL, pool and user counts.

  - name: map_messari
    kind: map
    initialBlock: 25940000
    inputs:
      - params: string
      - source: sf.substreams.v1.Clock
      - map: map_flows
      - map: map_vault_blocks
      - store: store_vault_registry
      - store: store_totals
    output:
      type: proto:messari.yield_aggregator.v1.Entities
    doc: Messari Yield Aggregator v1.3.1 entities (YieldAggregator, Vault, VaultFee, Token, Deposit, Withdraw) touched in this block. Params is network=<Messari Network literal>.

  - name: store_asset_prices
    kind: store
    initialBlock: 25940000
    updatePolicy: set
    valueType: string
    inputs:
      - map: map_vault_blocks
    doc: Last USD price seen per underlying, as "<price>@<block>".

  - name: map_positions
    kind: map
    initialBlock: 25940000
    inputs:
      - params: string
      - source: sf.substreams.v1.Clock
      - map: map_vault_blocks
      - store: store_vault_registry
      - store: store_vault_seen
      - store: store_vault_state
      - store: store_asset_prices
    output:
      type: proto:plimsoll.erc4626.v1.Positions
    doc: >-
      Nominated holder positions read by eth_call (balanceOf, convertToAssets)
      on a cadence and whenever a nominated vault moves, carried together with
      the block's VaultBlocks so one stream serves vault and note queries.
      Params - every=<blocks>;<noteId>=<holder>:<vault>,<vault>;...

params:
  map_flows: ""
  map_vault_blocks: "peg=0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48,0xdac17f958d2ee523a2206206994597c13d831ec7,0x6b175474e89094c44da98b954eedeac495271d0f,0xdc035d45d973e3ec169d2276ddab16f1e407384f,0x4c9edd5852cd905f086c759e8383e09bff1e68b3,0x6c3ea9036406852006290770bedfcaba0e23a0e8,0x40d16fc0246ad3160ccc09b8d0d3a2cd28ae6c2f,0xf939e0a03fb07f59a73314e73794be0e57ac1b4e,0x853d955acef822db058eb8505911ed77f175b99e;weth=0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2;eth_usd_feed=0x5f4ec3df9cbd43714fe2740f5e3616155c5b8419"
  map_messari: "network=MAINNET"
  map_positions: "every=50"

# Per-network overrides, selected with `--network`. Every address below was
# checked on-chain for symbol and decimals (tokens) or description() and
# decimals() (feeds) at a pinned block: mainnet at 25,953,495 and Base at
# 51,173,787.
networks:
  mainnet:
    initialBlock:
      map_flows: 25940000
      store_vault_seen: 25940000
      map_vault_probes: 25940000
      store_vault_registry: 25940000
      map_vault_blocks: 25940000
      store_vault_state: 25940000
      store_accounts: 25940000
      store_totals: 25940000
      map_messari: 25940000
      store_asset_prices: 25940000
      map_positions: 25940000
    params:
      map_flows: ""
      # USDC, USDT, DAI, USDS, USDe, PYUSD, GHO, crvUSD, FRAX; WETH; Chainlink ETH / USD.
      map_vault_blocks: "peg=0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48,0xdac17f958d2ee523a2206206994597c13d831ec7,0x6b175474e89094c44da98b954eedeac495271d0f,0xdc035d45d973e3ec169d2276ddab16f1e407384f,0x4c9edd5852cd905f086c759e8383e09bff1e68b3,0x6c3ea9036406852006290770bedfcaba0e23a0e8,0x40d16fc0246ad3160ccc09b8d0d3a2cd28ae6c2f,0xf939e0a03fb07f59a73314e73794be0e57ac1b4e,0x853d955acef822db058eb8505911ed77f175b99e;weth=0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2;eth_usd_feed=0x5f4ec3df9cbd43714fe2740f5e3616155c5b8419"
      map_messari: "network=MAINNET"
      # 50 blocks is about 10 minutes at 12 s.
      map_positions: "every=50"
  base:
    initialBlock:
      map_flows: 51150000
      store_vault_seen: 51150000
      map_vault_probes: 51150000
      store_vault_registry: 51150000
      map_vault_blocks: 51150000
      store_vault_state: 51150000
      store_accounts: 51150000
      store_totals: 51150000
      map_messari: 51150000
      store_asset_prices: 51150000
      map_positions: 51150000
    params:
      map_flows: ""
      # USDC, USDbC, DAI, USDS, USDe, USDT; WETH; Chainlink ETH / USD. EURC is
      # deliberately absent: it is not a dollar.
      map_vault_blocks: "peg=0x833589fcd6edb6e08f4c7c32d4f71b54bda02913,0xd9aaec86b65d86f6a7b5b1b0c42ffa531710b6ca,0x50c5725949a6f0c72e6c4a641f24049a917db0cb,0x820c137fa70c8691f0e44dc420a5e53c168921dc,0x5d3a1ff2b6bab83b63cd9ad0787074081a52ef34,0xfde4c96c8593536e31f229ea8f37b2ada2699bb2;weth=0x4200000000000000000000000000000000000006;eth_usd_feed=0x71041dddad3595f9ced3dccfbe3d1f4b0a16bb70"
      # Messari schema 1.3.1 has no BASE in its Network enum; later schema
      # versions add it. The literal is carried as-is.
      map_messari: "network=BASE"
      # 150 blocks is about 5 minutes at 2 s.
      map_positions: "every=150"
